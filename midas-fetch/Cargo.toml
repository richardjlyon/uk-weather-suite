[package]
name = "midas-fetch"
version = "0.1.0"
edition = "2024"
description = "Download and parse Met Office MIDAS Open station data from CEDA"
license = "MIT"

[dependencies]
anyhow = "1"
arrow = "59.1.0"
chrono = "0.4.45"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
indicatif = "0.17"
parquet = { version = "59.1.0", features = ["arrow", "zstd"] }
rayon = "1.12.0"
reqwest = { version = "0.12", features = ["json", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs"] }
